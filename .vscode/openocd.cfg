# CherryUSB CMSIS-DAP + STM32U585, connected through SWD.
source [find interface/cmsis-dap.cfg]
transport select swd
source [find target/stm32u5x.cfg]

# Keep the target script's reset clock handling; use 4 MHz while running.
adapter speed 10000

# Cortex-Debug retries RTT over TCL until the firmware initializes its block.
# A first check before main must not abort the remaining debug initialization.
rename {rtt start} rtt_start_now
proc {rtt start} {} {
    catch {rtt_start_now} result
    return $result
}
